
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Ticket | TravelGo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 25px;
        }
        .container {
            max-width: 520px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
        }
        h1 { color: #1769e0; }
        .details {
            background: #eef4fc;
            padding: 17px;
            border-radius: 9px;
            line-height: 1.7;
        }
        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
        }
        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #dce2eb;
            border-radius: 7px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            background: #1769e0;
            color: white;
            border: 0;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }
        .note { color: #64748b; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Passenger Booking</h1>

    <div class="details">
        <h3>{{ bus.bus_name }}</h3>
        <p>{{ bus.source }} → {{ bus.destination }}</p>
        <p>Departure: {{ bus.departure_time }}</p>
        <p>Fare per seat: PKR {{ "%.0f"|format(bus.fare) }}</p>
        <p>Available seats: {{ available_seats }}</p>
    </div>

    <form method="POST">
        <input type="hidden" name="travel_date" value="{{ travel_date }}">

        <label>Passenger Full Name</label>
        <input type="text" name="passenger_name"
               maxlength="100" required>

        <label>Email Address</label>
        <input type="email" name="passenger_email"
               maxlength="150" required>

        <label>Travel Date</label>
        <input type="date" value="{{ travel_date }}" disabled>

        <label>Number of Seats</label>
        <input type="number" name="seats"
               min="1" max="{{ available_seats }}"
               value="1" required>

        <p class="note">
            Your total fare will be calculated automatically.
        </p>

        <button type="submit">Confirm My Booking</button>
    </form>
</div>
</body>
</html>
